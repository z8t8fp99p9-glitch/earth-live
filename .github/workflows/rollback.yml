name: Roll back EARTH LIVE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Known-good release tag to restore"
        required: true
        type: string
        default: earth-live-v0.3

permissions:
  contents: read

concurrency:
  group: earth-live-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate selected release
    runs-on: ubuntu-latest
    steps:
      - name: Check release tag format
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^earth-live-v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release tag format."
            exit 1
          fi

      - name: Check out selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload rollback site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Restore selected release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy selected release
        id: deployment
        uses: actions/deploy-pages@v4
