<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="description" content="An independent, mobile-friendly planetary viewer with public earthquake data.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>EARTH // LIVE</title>
<style>
:root{color-scheme:dark;--bg:#060a12;--panel:rgba(7,14,26,.88);--line:rgba(119,183,223,.22);--cyan:#6be7ff;--muted:#8da3bc;--white:#eef7ff;--green:#9dffd3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white);overscroll-behavior:none}button{font:inherit;color:inherit;touch-action:manipulation}
#globe{position:absolute;inset:0}
.top{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.brand,.status{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:14px;padding:10px 12px;box-shadow:0 10px 35px #0005}
.brand{pointer-events:auto}.eyebrow{font-size:9px;letter-spacing:.22em;color:var(--cyan);font-weight:800}.brand h1{margin:4px 0 0;font-size:16px;letter-spacing:.12em}.brand p{margin:4px 0 0;font-size:9px;color:var(--muted)}
.status{font-size:9px;color:var(--green);letter-spacing:.08em;white-space:nowrap}
.note{position:absolute;top:calc(env(safe-area-inset-top,0px) + 86px);left:50%;transform:translateX(-50%);z-index:2;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#07101dcc;color:var(--muted);font-size:9px;white-space:nowrap;pointer-events:none}
.panel{position:absolute;z-index:3;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(22px);padding:13px;box-shadow:0 15px 45px #0008}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.section{font-size:10px;font-weight:800;letter-spacing:.17em;color:var(--muted)}.count{font-size:11px;color:var(--cyan);font-variant-numeric:tabular-nums}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
button{background:#111d2e;border:1px solid #253a51;border-radius:11px;padding:10px 6px;min-height:42px;font-size:10px;cursor:pointer}
button.active{border-color:#49cbe9;background:rgba(40,147,180,.2);box-shadow:inset 0 0 0 1px #49cbe944;color:#b9f5ff}button:disabled{opacity:.55}button:active{transform:scale(.985)}
.bottomline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:9px;line-height:1.4}
#refresh{padding:7px 10px;min-height:32px;white-space:nowrap}
#detail{position:absolute;z-index:4;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 126px);display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(18px);font-size:12px;line-height:1.45;box-shadow:0 12px 35px #0006}
#detail strong{display:block;color:var(--cyan);margin-bottom:5px;letter-spacing:.05em}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:1;color:var(--cyan);font-size:10px;letter-spacing:.2em;pointer-events:none;text-align:center;padding:20px}
.footer{margin-top:8px;text-align:center;color:#71869d;font-size:8px;letter-spacing:.04em}
@media(min-width:700px){.panel{left:22px;right:auto;bottom:22px;width:370px}.top{left:22px;right:22px}.note{top:104px}#detail{left:auto;right:22px;top:92px;width:310px}}
</style>
</head>
<body>
<div id="globe" aria-label="Interactive 3D globe"></div>
<div class="loading" id="loading">INITIALIZING EARTH VIEW…</div>
<div class="top">
 <div class="brand"><div class="eyebrow">OPEN PLANETARY VIEWER</div><h1>EARTH <span style="color:var(--cyan)">// LIVE</span></h1><p>PUBLIC DATA · EXPERIMENTAL BUILD 0.2</p></div>
 <div class="status">● SYSTEM READY</div>
</div>
<div class="note">DRAG TO ROTATE · PINCH TO ZOOM</div>
<div id="detail"><strong id="detailTitle">EARTH EVENT</strong><span id="detailText"></span></div>
<section class="panel">
 <div class="row"><span class="section">INTELLIGENCE LAYERS</span><span class="count" id="eventCount">CONNECTING…</span></div>
 <div class="layers">
  <button class="active" id="quakeBtn" aria-pressed="true">〰 Earthquakes</button>
  <button id="citiesBtn" aria-pressed="false">◎ Major cities</button>
  <button id="orbitBtn" aria-pressed="false">◉ Auto orbit</button>
 </div>
 <div class="bottomline"><span id="updated" aria-live="polite">Connecting to public USGS feed…</span><button id="refresh">↻ Refresh</button></div>
 <div class="footer">EXPLORATORY PUBLIC DATA · NOT FOR EMERGENCY OR NAVIGATION USE</div>
</section>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@2.37.0/dist/globe.gl.min.js"></script>
<script src="./app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {})); }</script>
</body>
</html>
