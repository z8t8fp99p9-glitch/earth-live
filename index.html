<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030509">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>EARTH // LIVE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="./style.css?v=adaptive-centered-globe-1.3.13">
  <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/";</script>
  <script defer src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script>
  <script defer src="./app-version.js?v=adaptive-centered-globe-1.3.13"></script>
  <script defer src="./app.js?v=adaptive-centered-globe-1.3.13"></script>
</head>
<body>
  <main id="app" aria-label="EARTH LIVE globe">
    <div id="globe" role="application" aria-label="Interactive satellite Earth. Drag to rotate and pinch to zoom."></div>
    <nav id="primaryControls" aria-label="Earth Live controls">
      <button type="button">Basic</button>
      <button type="button">HD</button>
      <button type="button">Live Location</button>
      <button type="button">Sun</button>
      <button type="button">Moon</button>
      <button type="button">Stacks</button>
    </nav>
    <div id="errorMessage" hidden role="status">The globe could not load. Check your internet connection and reload the page.</div>
  </main>
</body>
</html>
