<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030509"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><title>EARTH // LIVE</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="./style.css">
<script>window.CESIUM_BASE_URL='https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/';</script>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script>
</head><body><main id="app"><div id="globe" aria-label="Interactive Earth globe"></div><div class="edge-gesture-guard edge-top" aria-hidden="true"></div><div class="edge-gesture-guard edge-right" aria-hidden="true"></div><div class="edge-gesture-guard edge-bottom" aria-hidden="true"></div><div class="edge-gesture-guard edge-left" aria-hidden="true"></div><div class="app-stamp" aria-label="EARTH // LIVE"><span class="app-stamp-dot" aria-hidden="true"></span><span class="app-stamp-copy"><span class="app-stamp-name">EARTH <i>//</i> LIVE</span><span class="app-stamp-version" id="appVersion">Loading version…</span></span></div>
<section class="astro-panel glass" id="astroPanel" hidden aria-label="Sun and Moon tracker">
  <div class="astro-head"><div><div class="astro-title">SUN / MOON</div><div class="astro-subtitle" id="astroSummary">Live sky geometry</div></div><button class="astro-close" id="astroClose" aria-label="Close Sun and Moon panel">×</button></div>
  <div class="astro-row astro-tabs" role="group" aria-label="Tracked object">
    <button class="astro-choice active" id="sunTab" aria-pressed="true">☼ Sun</button><button class="astro-choice" id="moonTab" aria-pressed="false">☾ Moon</button>
  </div>
  <div class="astro-row astro-mode" role="group" aria-label="Time mode">
    <button class="astro-choice active" id="liveMode" aria-pressed="true">Live</button><button class="astro-choice" id="simulateMode" aria-pressed="false">Simulate</button>
  </div>
  <div class="astro-sim" id="astroSim" hidden>
    <label for="astroDate">Simulation time</label>
    <input id="astroDate" type="datetime-local">
    <div class="astro-time-actions"><button id="minusHour" aria-label="Back one hour">− 1h</button><button id="plusHour" aria-label="Forward one hour">+ 1h</button><button id="playPause">▶ Play</button></div>
    <button class="astro-live-return" id="returnLive">Return to live time</button>
  </div>
  <div class="astro-info" id="astroInfo">Calculating position…</div>
  <div class="astro-footer" id="moonOverlayRow" hidden><span>Moon above 40°</span><label class="mini-switch"><input type="checkbox" id="moonOverlayToggle" checked><span></span></label></div>
</section>
<div class="bottom-ui" aria-label="Map controls">
<div class="quality glass" role="group" aria-label="Map quality"><button class="quality-btn active" id="basicBtn" aria-pressed="true">Basic</button><button class="quality-btn" id="hdBtn" aria-pressed="false">HD</button></div>
<button class="icon-btn glass" id="locateBtn" aria-label="Location feature not enabled yet" title="Location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.2"/><circle cx="12" cy="12" r="2.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
<button class="icon-btn glass active" id="lightingBtn" aria-label="Sun and Moon tracker" title="Sun / Moon">☼</button>
<button class="icon-btn glass" id="layersBtn" aria-label="Data layers not enabled yet" title="Data layers"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg></button>
</div><div id="errorMessage" class="error glass" hidden>Earth could not load. Check your connection and reload.</div></main>
<script src="./app-version.js"></script><script src="./data-store.js"></script><script src="./moon-dataset.js"></script><script src="./sun-moon-tracker.js"></script><script src="./app.js"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script>
</body></html>
