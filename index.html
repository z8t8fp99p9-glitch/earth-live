<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030509">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>EARTH // LIVE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="./style.css?v=earth-live-deck-code-v1.5.20">
  <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/";</script>
  <script defer src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script>
  <script defer src="./app-version.js?v=earth-live-deck-code-v1.5.20"></script>
  <script defer src="./app.js?v=earth-live-deck-code-v1.5.20"></script>
</head>
<body>
  <main id="app" aria-label="EARTH LIVE globe">
    <div id="globe" role="application" aria-label="Interactive satellite Earth. Drag to rotate and pinch to zoom."></div>
    <nav id="primaryDock" class="primary-dock" aria-label="Main controls">
      <div class="orb-deck-plate" aria-hidden="true"><img class="orb-deck-art" src="./deck-smoked-glass.png" alt="" draggable="false"></div>
      <button class="orb-button" type="button" data-orb="basic" aria-pressed="true"><img src="./earth-basic.webp" alt=""><span class="orb-label">Basic</span><i class="orb-indicator" aria-hidden="true"></i></button>
      <button class="orb-button" type="button" data-orb="hd" aria-pressed="false"><img src="./earth-hd.webp" alt=""><span class="orb-label">HD</span><i class="orb-indicator" aria-hidden="true"></i></button>
      <button class="orb-button" type="button" data-orb="location" aria-pressed="false"><img src="./location.webp" alt=""><span class="orb-label">Live Location</span><i class="orb-indicator" aria-hidden="true"></i></button>
      <button class="orb-button" type="button" data-orb="sun" aria-pressed="false"><img src="./sun.webp" alt=""><span class="orb-label">Sun</span><i class="orb-indicator" aria-hidden="true"></i></button>
      <button class="orb-button" type="button" data-orb="moon" aria-pressed="false"><img src="./moon.webp" alt=""><span class="orb-label">Moon</span><i class="orb-indicator" aria-hidden="true"></i></button>
      <button class="orb-button" type="button" data-orb="stacks" aria-pressed="false"><img src="./stacks.webp" alt=""><span class="orb-label">Stacks</span><i class="orb-indicator" aria-hidden="true"></i></button>
    </nav>
    <section id="stacksPanel" class="stacks-panel" role="dialog" aria-modal="false" aria-labelledby="stacksTitle" hidden>
      <header class="stacks-header"><div><h2 id="stacksTitle">STACKS</h2><p>LAYERS · DATA · SETTINGS</p></div><button id="closeStacks" class="panel-close" type="button" aria-label="Close Stacks">×</button></header>
      <div id="stacksHome" class="stacks-list">
        <button class="stack-option settings-option" data-stack-view="customise" type="button"><span class="stack-symbol">⚙</span><span class="stack-copy"><strong>Settings / Customisation</strong><small>Appearance · Theme · Controls</small></span><span class="stack-chevron">›</span></button>
        <button class="stack-option" data-stack-feature="weather" type="button"><span class="stack-symbol">☁</span><span class="stack-copy"><strong>Weather &amp; Clouds</strong><small>Cloud cover · Storms · Lightning</small></span><span class="stack-chevron">›</span></button>
        <button class="stack-option" data-stack-feature="air-traffic" type="button"><span class="stack-symbol">✈</span><span class="stack-copy"><strong>Air Traffic</strong><small>Aircraft · Flight paths</small></span><span class="stack-chevron">›</span></button>
        <button class="stack-option" data-stack-feature="road-traffic" type="button"><span class="stack-symbol">▣</span><span class="stack-copy"><strong>Road Traffic</strong><small>Traffic layers · Road conditions</small></span><span class="stack-chevron">›</span></button>
        <button class="stack-option" data-stack-feature="imagery" type="button"><span class="stack-symbol">◉</span><span class="stack-copy"><strong>Imagery</strong><small>Satellite imagery · Map styles</small></span><span class="stack-chevron">›</span></button>
      </div>
      <section id="customiseView" class="stack-subview" hidden>
        <button class="stack-back" id="backToStacks" type="button">‹ Back to Stacks</button>
        <h3>Appearance</h3><p class="panel-description">Choose the deck material independently from orb artwork.</p>
        <div class="theme-grid deck-theme-grid" role="group" aria-label="Deck theme">
          <button class="theme-choice selected" data-deck-theme="smoked-glass" type="button"><i class="theme-swatch smoked"></i><span>Smoked Glass</span></button>
          <button class="theme-choice" data-deck-theme="clear-glass" type="button"><i class="theme-swatch clear"></i><span>Clear Glass</span></button>
          <button class="theme-choice" data-deck-theme="frosted-glass" type="button"><i class="theme-swatch frosted"></i><span>Frosted Glass</span></button>
          <button class="theme-choice" data-deck-theme="neon-edge-glass" type="button"><i class="theme-swatch neon"></i><span>Neon Edge Glass</span></button>
          <button class="theme-choice" data-deck-theme="desert-sand" type="button"><i class="theme-swatch sand"></i><span>Desert Sand</span></button>
          <button class="theme-choice" data-deck-theme="dark-sand" type="button"><i class="theme-swatch stone"></i><span>Dark Sand</span></button>
          <button class="theme-choice" data-deck-theme="mixed-stone" type="button"><i class="theme-swatch stone"></i><span>Mixed Stone</span></button>
          <button class="theme-choice" data-deck-theme="volcanic-stone" type="button"><i class="theme-swatch stone"></i><span>Volcanic Stone</span></button>
          <button class="theme-choice" data-deck-theme="ice" type="button"><i class="theme-swatch ice"></i><span>Ice</span></button>
          <button class="theme-choice" data-deck-theme="fire" type="button"><i class="theme-swatch fire"></i><span>Fire</span></button>
        </div>
        <h3>Orb Collection</h3>
        <div class="collection-row"><span class="collection-dot current"></span><span><strong>Futuristic Glass</strong><small>Current collection</small></span><span class="collection-check">✓</span></div>
        <div class="collection-row unavailable"><span class="collection-dot sand-dot"></span><span><strong>Sand Glass</strong><small>Collection assets to be added</small></span></div>
        <h3>Display Area</h3>
        <label class="display-choice"><input type="radio" name="displayMode" value="full" checked><span><strong>Full Screen</strong><small>Use the entire display.</small></span></label>
        <label class="display-choice"><input type="radio" name="displayMode" value="top"><span><strong>Cutouts at Top</strong><small>Respect the top safe area.</small></span></label>
        <label class="display-choice"><input type="radio" name="displayMode" value="bottom"><span><strong>Cutouts at Bottom</strong><small>Respect the bottom safe area.</small></span></label>
        <label class="display-choice"><input type="radio" name="displayMode" value="both"><span><strong>Cutouts at Top &amp; Bottom</strong><small>Respect both safe areas.</small></span></label>
      </section>
      <div id="stackNotice" class="stack-notice" role="status" hidden></div>
    </section>
    <div id="errorMessage" hidden role="status">The globe could not load. Check your internet connection and reload the page.</div>
  </main>
</body>
</html>
