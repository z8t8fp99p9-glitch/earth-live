<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030509">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>EARTH // LIVE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="./style.css?v=earth-75-percent-v1.5.13">
  <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/";</script>
  <script defer src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script>
  <script defer src="./app-version.js?v=earth-75-percent-v1.5.13"></script>
  <script defer src="./app.js?v=earth-75-percent-v1.5.13"></script>
</head>
<body>
  <main id="app" aria-label="EARTH LIVE globe">
    <div id="globe" role="application" aria-label="Interactive satellite Earth. Drag to rotate and pinch to zoom."></div>
    <nav id="primaryDock" class="primary-dock" aria-label="Adaptive control deck" aria-hidden="true"></nav>
    <button id="moreOptionsButton" class="more-options-button" type="button" aria-haspopup="dialog" aria-expanded="false">More Options</button>
    <section id="personalisationPanel" class="personalisation-panel" role="dialog" aria-modal="false" aria-labelledby="personalisationTitle" hidden>
      <div class="panel-heading"><strong id="personalisationTitle">Personalisation</strong><button id="closePersonalisation" class="panel-close" type="button" aria-label="Close personalisation">×</button></div>
      <p class="panel-description">Choose how EARTH // LIVE uses your display.</p>
      <label class="display-choice"><input type="radio" name="displayMode" value="full" checked><span><strong>Full Screen</strong><small>Use the entire display, including areas behind cutouts.</small></span></label>
      <label class="display-choice"><input type="radio" name="displayMode" value="top"><span><strong>Cutouts at Top</strong><small>Respect the top safe area; use the full display below it.</small></span></label>
      <label class="display-choice"><input type="radio" name="displayMode" value="bottom"><span><strong>Cutouts at Bottom</strong><small>Use the full display at the top; respect the bottom safe area.</small></span></label>
      <label class="display-choice"><input type="radio" name="displayMode" value="both"><span><strong>Cutouts at Top &amp; Bottom</strong><small>Respect safe areas at both ends of the display.</small></span></label>
    </section>
    <div id="errorMessage" hidden role="status">The globe could not load. Check your internet connection and reload the page.</div>
  </main>
</body>
</html>
